name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Temurin JDK 17, 21, and 25
        run: |
          set -euxo pipefail
          for v in 17 21 25; do
            dir="/opt/jdk${v}"
            mkdir -p "$dir"
            curl --retry 3 -fsSL -o "/tmp/jdk${v}.tar.gz" \
              "https://api.adoptium.net/v3/binary/latest/${v}/ga/linux/x64/jdk/hotspot/normal/eclipse"
            tar -xzf "/tmp/jdk${v}.tar.gz" -C "$dir" --strip-components=1
            rm -f "/tmp/jdk${v}.tar.gz"
            "$dir/bin/java" -version
          done

      - name: Build helper natives for all platforms
        run: |
          set -euxo pipefail
          bash scripts/build-natives.sh

      - name: Run Go tests
        run: |
          set -euxo pipefail
          GO=$(ls -d "${XDG_CACHE_HOME:-$HOME/.cache}/mclink/tsgo"/*/bin/go | head -n 1)
          cd helper
          GOFLAGS=-mod=mod CGO_ENABLED=0 "$GO" test ./...

      - name: Build all leaf jars (isolated per-leaf invocations)
        env:
          JAVA_HOME: /opt/jdk21
        run: |
          set -euxo pipefail
          # Two memory constraints shape how this is built:
          #   1. org.gradle.java.installations.* must be on the command line (or in
          #      gradle.properties); Gradle ignores them when set via GRADLE_OPTS, so
          #      the /opt/jdk* toolchains would otherwise go undetected.
          #   2. The runner has ~7 GiB free. A single `./gradlew build` configures all
          #      12 leaves in one daemon (6 Fabric Loom leaves' MC artifacts + the Forge
          #      MCP decompile) and the OOM killer SIGKILLs the decompile. Building each
          #      leaf in its own invocation with configure-on-demand keeps the daemon to
          #      one leaf, so the decompile never shares the heap with the Loom leaves.
          # The Forge leaf (the MCP decompile, the memory hog) runs in its own daemon so
          # it starts from a clean, low-memory heap.
          JDKS=-Dorg.gradle.java.installations.paths=/opt/jdk17,/opt/jdk21,/opt/jdk25
          ./gradlew --no-daemon --configure-on-demand $JDKS :forge-1.20.1:build --console=plain
          for leaf in \
            fabric-1.20.1 fabric-1.21.1 fabric-1.21.11 \
            fabric-26.1 fabric-26.2 fabric-26.3 \
            neoforge-1.21.1 neoforge-1.21.11 neoforge-26.1 neoforge-26.2 neoforge-26.3
          do
            ./gradlew --configure-on-demand $JDKS ":$leaf:build" --console=plain
          done

      - name: Verify the tag matches the mod version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "v$version" != "${{ forgejo.ref_name }}" ]]; then
            echo "tag ${{ forgejo.ref_name }} does not match mod_version $version" >&2
            exit 1
          fi

      - name: Stage release assets
        run: |
          set -euxo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          base=tailcarft
          mkdir -p dist/release
          for loader in fabric neoforge forge; do
            for mc in $(sed -n "s/^targets.${loader}=//p" gradle.properties | tr ',' ' '); do
              cp "${loader}-${mc}/build/libs/${base}-${version}-${loader}-${mc}.jar" dist/release/
            done
          done
          (cd dist/release && sha256sum *.jar > SHA256SUMS)
          ls -l dist/release

      - name: Publish the Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: dist/release
          title: ${{ forgejo.ref_name }}
          prerelease: ${{ contains(forgejo.ref_name, '-') }}
          override: 'true'
