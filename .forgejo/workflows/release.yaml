name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v6

      # Fail fast before spending build time on a mistagged release.
      - name: Verify the tag matches the mod version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [[ "v$version" != "${{ forgejo.ref_name }}" ]]; then
            echo "tag ${{ forgejo.ref_name }} does not match mod_version $version" >&2
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────
      # JDKs
      # ─────────────────────────────────────────────────────────────

      - name: Cache Temurin JDKs
        id: jdk-cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            /opt/jdk17
            /opt/jdk21
            /opt/jdk25
          key: ${{ runner.os }}-temurin-jdks-17-21-25-v1

      - name: Install Temurin JDK 17, 21, and 25
        if: steps.jdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail

          for v in 17 21 25; do
            dir="/opt/jdk${v}"
            mkdir -p "$dir"

            curl --retry 3 -fsSL \
              -o "/tmp/jdk${v}.tar.gz" \
              "https://api.adoptium.net/v3/binary/latest/${v}/ga/linux/x64/jdk/hotspot/normal/eclipse"

            tar -xzf "/tmp/jdk${v}.tar.gz" \
              -C "$dir" \
              --strip-components=1

            rm -f "/tmp/jdk${v}.tar.gz"

            "$dir/bin/java" -version
          done

      # ─────────────────────────────────────────────────────────────
      # Go
      # ─────────────────────────────────────────────────────────────

      # Keyed on the whole helper source (and the build script, which pins the
      # Tailscale Go revision), so a hit means the built natives in the cache
      # are exactly up to date and rebuilding/testing is skipped.
      - name: Cache cauda Go
        id: go-cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cache/cauda/tsgo
            ~/.cache/go-build
            ~/go/pkg/mod
            common/src/main/resources/assets/cauda/native
          key: ${{ runner.os }}-go-${{ hashFiles('helper/**', 'scripts/build-natives.sh') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build helper natives for all platforms
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          bash scripts/build-natives.sh

      - name: Run Go tests
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          GO=$(find "${XDG_CACHE_HOME:-$HOME/.cache}/cauda/tsgo" \
            -type f \
            -path '*/bin/go' \
            -print -quit)

          test -n "$GO"
          "$GO" version

          cd helper
          GOFLAGS=-mod=mod CGO_ENABLED=0 "$GO" test ./...

      # ─────────────────────────────────────────────────────────────
      # Gradle
      # ─────────────────────────────────────────────────────────────

      - name: Cache Gradle
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─────────────────────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────────────────────

      # The natives are gitignored and only exist from the build above (or the
      # cache restore), so fail fast if a cache hit restored nothing usable.
      - name: Verify helper natives are present
        run: |
          set -euo pipefail
          root=common/src/main/resources/assets/cauda/native
          test -f "$root/checksums.json"
          for d in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            test -n "$(ls "$root/$d"/cauda-helper* 2>/dev/null)"
          done

      # Capture runner resource state before the build to diagnose
      # environment-dependent failures (disk, inodes, file descriptors, RAM).
      - name: Show CI resources before build
        run: |
          df -h
          df -i
          ulimit -n
          free -h

      # A cold release build writes ~7-8G (JDKs, Go toolchain, Gradle caches,
      # decompiled Minecraft artifacts, eight fat jars with bundled natives).
      # The act runner's volume is small, so fail fast with an actionable
      # message instead of a cryptic zip I/O error after a long build.
      - name: Verify the runner has enough free disk
        run: |
          set -euo pipefail
          avail_g=$(( $(df -k --output=avail / | tail -1 | tr -dc 0-9) / 1024 / 1024 ))
          echo "free space on /: ${avail_g}G"
          if [ "$avail_g" -lt 10 ]; then
            echo "runner disk nearly full: ${avail_g}G free, the release build needs ~10G. Free space on the runner host (e.g. docker system prune) or enlarge its volume, then re-run." >&2
            exit 1
          fi

      # The build cache (under the cached ~/.gradle/caches) stores the
      # expensive loom remap and compile outputs, so a release build that only
      # bumped the mod version reuses them instead of redoing the work.
      - name: Build all leaf jars
        env:
          JAVA_HOME: /opt/jdk21
        run: |
          set -uxo pipefail
          JDKS=-Dorg.gradle.java.installations.paths=/opt/jdk17,/opt/jdk21,/opt/jdk25
          # The runner's volume is small; if the build fills it, the jar tasks
          # die with a cryptic zip I/O error. Snapshot resources on exit so the
          # exhaustion is visible right next to the failure.
          trap 'echo "=== runner resources after build (exit $?) ==="; df -h; df -i; free -h' EXIT
          ./gradlew $JDKS -Dorg.gradle.caching=true build --console=plain --stacktrace

      # ─────────────────────────────────────────────────────────────
      # Release
      # ─────────────────────────────────────────────────────────────

      - name: Stage release assets
        run: |
          set -euxo pipefail
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          base=cauda
          mkdir -p dist/release
          for loader in fabric neoforge forge quilt; do
            for mc in $(sed -n "s/^targets.${loader}=//p" gradle.properties | tr ',' ' '); do
              cp "${loader}-${mc}/build/libs/${base}-${version}-${loader}-${mc}.jar" dist/release/
            done
          done
          (cd dist/release && sha256sum *.jar > SHA256SUMS)
          ls -l dist/release

      - name: Publish the Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          release-dir: dist/release
          title: ${{ forgejo.ref_name }}
          prerelease: ${{ contains(forgejo.ref_name, '-') }}
          override: 'true'
