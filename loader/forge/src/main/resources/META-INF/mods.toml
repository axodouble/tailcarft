modLoader = "javafml"
loaderVersion = "[47,)"
license = "BSD-3-Clause"

[[mods]]
modId = "cauda"
version = "${version}"
displayName = "Cauda"
description = "Share a singleplayer Minecraft world with friends over the internet — no dedicated server and no account. Cauda publishes your world the way vanilla Open to LAN does and tunnels the game port through a lightweight userspace WireGuard transport, so friends can join with a short-lived invite."
authors = ["Jasper \"Axodouble\" V."]

[[mixins]]
config = "cauda.mixins.json"

[[mixins]]
config = "cauda.forge.mixins.json"
